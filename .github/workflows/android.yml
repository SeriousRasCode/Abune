name: Android build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: github.event_name == 'pull_request'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        if: github.event_name == 'pull_request'
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Cache Android NDK and CMake
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-tools-ubuntu-24.04-ndk-28.2.13676358-cmake-3.22.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-infos
      - name: Inspect prayer recording pauses
        if: github.head_ref == 'feature-audio-follow-along'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 tools/audio_pauses.py
      - name: Align prayer text with recording
        if: github.head_ref == 'feature-audio-follow-along'
        run: |
          python3 -m venv /tmp/prayer-align-venv
          /tmp/prayer-align-venv/bin/pip install --quiet stable-ts
          /tmp/prayer-align-venv/bin/python tools/audio_align.py
      - name: Run tests
        run: flutter test
      - name: Build Android on GitHub
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

  release:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-tools-ubuntu-24.04-ndk-28.2.13676358-cmake-3.22.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release environment signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.p12
          {
            printf 'storeFile=release-key.p12\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > android/key.properties
      - name: Build signed release APK
        run: flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64 --split-debug-info=build/symbols --build-number=${{ github.run_number }}
      - name: Verify release APK signatures
        shell: bash
        run: |
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in build/app/outputs/flutter-apk/app-{armeabi-v7a,arm64-v8a}-release.apk; do
            "$signer" verify --verbose "$apk"
          done
      - name: Upload signed ARM APKs
        uses: actions/upload-artifact@v4
        with:
          name: abune-android-release
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: abune-android-symbols
          path: build/symbols/
          if-no-files-found: error
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apks=(
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${apks[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${apks[@]}" --verify-tag --generate-notes --title "Abune $GITHUB_REF_NAME"
          fi
