name: Android build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build Android on GitHub
        run: flutter build apk --debug

  release:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release environment signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.p12
          {
            printf 'storeFile=release-key.p12\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > android/key.properties
      - name: Build signed release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: abune-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
