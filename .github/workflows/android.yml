name: Android build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-sibhat-audio:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feature-sibhat-tselot'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install downloader
        run: python3 -m pip install --user --upgrade yt-dlp
      - name: Inspect and download source recording
        shell: bash
        run: |
          "$HOME/.local/bin/yt-dlp" --print 'title=%(title)s duration=%(duration)s uploader=%(uploader)s' 'https://www.youtube.com/watch?v=43E8T8TsBIc'
          "$HOME/.local/bin/yt-dlp" -f bestaudio -x --audio-format mp3 --audio-quality 5 -o 'sibhat-source.%(ext)s' 'https://www.youtube.com/watch?v=43E8T8TsBIc'
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 sibhat-source.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: sibhat-source-audio
          path: sibhat-source.mp3
          if-no-files-found: error
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: github.event_name == 'pull_request'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        if: github.event_name == 'pull_request'
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Cache Android NDK and CMake
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-tools-ubuntu-24.04-ndk-28.2.13676358-cmake-3.22.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build Android on GitHub
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-tools-ubuntu-24.04-ndk-28.2.13676358-cmake-3.22.1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.10'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing release environment signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.p12
          {
            printf 'storeFile=release-key.p12\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > android/key.properties
      - name: Build signed release APK
        run: flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64 --split-debug-info=build/symbols --build-number=${{ github.run_number }}
      - name: Verify release APK signatures
        shell: bash
        run: |
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in build/app/outputs/flutter-apk/app-{armeabi-v7a,arm64-v8a}-release.apk; do
            "$signer" verify --verbose "$apk"
          done
      - name: Build signed Play App Bundle
        run: flutter build appbundle --release --split-debug-info=build/symbols --build-number=${{ github.run_number }}
      - name: Verify Play App Bundle signature
        shell: bash
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab > /tmp/abune-bundle-verification.txt
          cat /tmp/abune-bundle-verification.txt
          grep -q 'jar verified' /tmp/abune-bundle-verification.txt
      - name: Upload signed ARM APKs
        uses: actions/upload-artifact@v4
        with:
          name: abune-android-release
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload Play App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: abune-play-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: abune-android-symbols
          path: build/symbols/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)
          if [[ -z "$version" ]]; then
            echo 'Could not read app version from pubspec.yaml' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          apks=(
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${apks[@]}" --clobber
          else
            gh release create "$tag" "${apks[@]}" --target "$GITHUB_SHA" --generate-notes --latest --title "Abune v$version (build $GITHUB_RUN_NUMBER)"
          fi
